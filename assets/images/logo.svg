<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular subtle container -->
  <rect width="48" height="48" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Sync loop arcs -->
  <path d="M 24 9 A 15 15 0 0 1 39 24 L 35 24 A 11 11 0 0 0 24 13 Z" fill="url(#syncGrad)" filter="url(#glow)"/>
  <polygon points="41,20 45,26 37,26" fill="#38bdf8"/>

  <path d="M 24 39 A 15 15 0 0 1 9 24 L 13 24 A 11 11 0 0 0 24 35 Z" fill="url(#syncGrad)" filter="url(#glow)"/>
  <polygon points="7,28 3,22 11,22" fill="#a855f7"/>

  <!-- Academic Cap in Center -->
  <polygon points="24,17 33,22 24,27 15,22" fill="url(#capGrad)"/>
  <path d="M 18 24 L 18 29 Q 24 33 30 29 L 30 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="33" cy="22" r="1.5" fill="#38bdf8"/>
  <line x1="33" y1="22" x2="35" y2="28" stroke="#38bdf8" stroke-width="1.2"/>
</svg>

